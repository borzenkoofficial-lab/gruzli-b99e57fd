name: Gruzli CI

on:
  push:
    branches: ["main", "migration/**"]
  pull_request:
    branches: ["main", "migration/**"]

concurrency:
  group: gruzli-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gruzli_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gruzli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gruzli_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Install Amvera server dependencies
        run: npm install --prefix server --omit=dev --no-audit --no-fund
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - run: node --check server/index.mjs
      - run: node --check server/db.mjs
      - run: node --check server/migrate.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:server
      - run: npm run build
      - name: Build Amvera Docker image
        run: docker build -t gruzli-amvera .

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npx playwright test --project=chromium
